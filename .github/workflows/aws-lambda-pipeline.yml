name: Deploy Mavencrest Lambda

on:
  push:
    branches:
      - main

  pull_request:
    branches:
      - main

permissions:
  contents: read
  id-token: write

env:
  AWS_REGION: us-east-1
  AWS_ACCOUNT_ID: "063899249655"

  ECR_REPOSITORY: mavencrest-lambda
  ECR_REGISTRY: 063899249655.dkr.ecr.us-east-1.amazonaws.com

  LAMBDA_FUNCTION: mavencrest-storefront-lambda
  PRODUCTION_URL: https://stores.mavencrest.site


# ============================================================
# TEST
# ============================================================

jobs:

  test:
    name: Test Application
    runs-on: ubuntu-latest

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build Storefront
        run: npm run build:store


# ============================================================
# BUILD AND PUSH
# ============================================================

  build:
    name: Build and Push Lambda Image
    runs-on: ubuntu-latest
    needs: test

    # Do not deploy images from pull requests
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'

    steps:

      - name: Checkout
        uses: actions/checkout@v4

      - name: Use Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: npm

      - name: Install Dependencies
        run: npm ci

      - name: Generate Prisma Client
        run: npm run db:generate

      - name: Build Storefront
        run: npm run build:store


      # --------------------------------------------------------
      # PREPARE NEXT.JS STANDALONE ARTIFACT
      # --------------------------------------------------------

      - name: Prepare Lambda Artifact
        run: |
          set -e

          echo "Preparing Next.js standalone Lambda artifact..."

          rm -rf app
          mkdir -p app

          cp -R \
            apps/storefront/.next/standalone/. \
            app/

          mkdir -p \
            app/apps/storefront/.next/static

          cp -R \
            apps/storefront/.next/static/. \
            app/apps/storefront/.next/static/

          cp -R \
            apps/storefront/public \
            app/apps/storefront/public

          find app -name '.env*' -type f -delete
          find app -name '.DS_Store' -delete


      # --------------------------------------------------------
      # AWS AUTHENTICATION USING OIDC
      # --------------------------------------------------------

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_LAMBDA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # LOGIN TO ECR
      # --------------------------------------------------------

      - name: Login to Amazon ECR
        uses: aws-actions/amazon-ecr-login@v2


      # --------------------------------------------------------
      # ARM64 BUILD SUPPORT
      # --------------------------------------------------------

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3


      # --------------------------------------------------------
      # BUILD IMAGE
      # --------------------------------------------------------

      - name: Build Lambda Image
        run: |
          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "Building:"
          echo "$IMAGE_URI"

          docker buildx build \
            --platform linux/arm64 \
            --provenance=false \
            --load \
            -f Dockerfile.lambda \
            -t "$IMAGE_URI" \
            .

          echo "IMAGE_URI=$IMAGE_URI" >> "$GITHUB_ENV"


      # --------------------------------------------------------
      # SECURITY SCAN
      # --------------------------------------------------------

      - name: Scan Image with Trivy
        uses: aquasecurity/trivy-action@master
        with:
          image-ref: ${{ env.IMAGE_URI }}
          format: table
          severity: HIGH,CRITICAL
          exit-code: "0"


      # --------------------------------------------------------
      # PUSH IMMUTABLE IMAGE TO ECR
      # --------------------------------------------------------

      - name: Push Image to ECR
        run: |
          echo "Pushing:"
          echo "$IMAGE_URI"

          docker push "$IMAGE_URI"


# ============================================================
# DEPLOY PRODUCTION
# ============================================================

  deploy:
    name: Deploy Lambda Production
    runs-on: ubuntu-latest
    needs: build

    environment: Production

    steps:

      - name: Configure AWS Credentials
        uses: aws-actions/configure-aws-credentials@v5
        with:
          role-to-assume: ${{ secrets.AWS_LAMBDA_ROLE_ARN }}
          aws-region: ${{ env.AWS_REGION }}


      # --------------------------------------------------------
      # DEPLOY + HEALTH CHECK + ROLLBACK
      # --------------------------------------------------------

      - name: Deploy Lambda with Automatic Rollback
        run: |
          set -e

          IMAGE_URI="${ECR_REGISTRY}/${ECR_REPOSITORY}:${GITHUB_SHA}"

          echo "=========================================="
          echo "CAPTURING CURRENT PRODUCTION IMAGE"
          echo "=========================================="

          PREVIOUS_IMAGE=$(aws lambda get-function \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION" \
            --query 'Code.ImageUri' \
            --output text)

          echo "Previous image:"
          echo "$PREVIOUS_IMAGE"


          if [ -z "$PREVIOUS_IMAGE" ] || [ "$PREVIOUS_IMAGE" = "None" ]; then
            echo "ERROR: Could not determine current Lambda image."
            exit 1
          fi


          echo "=========================================="
          echo "DEPLOYING NEW LAMBDA IMAGE"
          echo "=========================================="

          echo "New image:"
          echo "$IMAGE_URI"

          aws lambda update-function-code \
            --function-name "$LAMBDA_FUNCTION" \
            --image-uri "$IMAGE_URI" \
            --region "$AWS_REGION"


          echo "=========================================="
          echo "WAITING FOR LAMBDA UPDATE"
          echo "=========================================="

          aws lambda wait function-updated \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION"


          FUNCTION_STATE=$(aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION" \
            --query 'State' \
            --output text)

          UPDATE_STATUS=$(aws lambda get-function-configuration \
            --function-name "$LAMBDA_FUNCTION" \
            --region "$AWS_REGION" \
            --query 'LastUpdateStatus' \
            --output text)

          echo "Lambda state: $FUNCTION_STATE"
          echo "Update status: $UPDATE_STATUS"


          if [ "$FUNCTION_STATE" != "Active" ] || \
             [ "$UPDATE_STATUS" != "Successful" ]; then

            echo "Lambda update failed."
            PROD_STATUS="000"

          else

            echo "=========================================="
            echo "TESTING PRODUCTION"
            echo "=========================================="

            sleep 10

            PROD_STATUS=$(curl \
              -L \
              --write-out "%{http_code}" \
              --silent \
              --output /dev/null \
              --retry 5 \
              --retry-delay 5 \
              "${PRODUCTION_URL}/api/health" || true)

          fi


          echo "Production status: $PROD_STATUS"


          # ==================================================
          # ROLLBACK
          # ==================================================

          if [ "$PROD_STATUS" != "200" ]; then

            echo "=========================================="
            echo "HEALTH CHECK FAILED"
            echo "ROLLING BACK"
            echo "=========================================="

            aws lambda update-function-code \
              --function-name "$LAMBDA_FUNCTION" \
              --image-uri "$PREVIOUS_IMAGE" \
              --region "$AWS_REGION"


            aws lambda wait function-updated \
              --function-name "$LAMBDA_FUNCTION" \
              --region "$AWS_REGION"

            sleep 10


            ROLLBACK_STATUS=$(curl \
              -L \
              --write-out "%{http_code}" \
              --silent \
              --output /dev/null \
              --retry 5 \
              --retry-delay 5 \
              "${PRODUCTION_URL}/api/health" || true)


            echo "Rollback status: $ROLLBACK_STATUS"


            if [ "$ROLLBACK_STATUS" = "200" ]; then

              echo "=========================================="
              echo "ROLLBACK VERIFIED"
              echo "PRODUCTION IS HEALTHY"
              echo "=========================================="

            else

              echo "=========================================="
              echo "CRITICAL: ROLLBACK FAILED"
              echo "=========================================="

            fi

            exit 1
          fi


          echo "=========================================="
          echo "PRODUCTION DEPLOYMENT SUCCESSFUL"
          echo "=========================================="

          echo "Image: $IMAGE_URI"
          echo "Application: $PRODUCTION_URL"
