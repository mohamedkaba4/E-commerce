trigger: none

pr: none

pool:
  vmImage: ubuntu-latest

resources:
  repositories:
  - repository: app
    type: github
    name: mohamedkaba4/E-commerce
    endpoint: mohamedkaba4

variables:
  prodConnection: 'sc-mcrest-prod'

  tfStateContainer: 'tfstate'

  foundationStateKey: 'foundation-prod.tfstate'
  workloadStateKey: 'workloads-prod.tfstate'

stages:

- stage: ValidateRepos
  displayName: Validate Repositories

  jobs:
  - job: Validate
    steps:
    - checkout: self
      path: s/infra

    - checkout: app
      path: s/E-commerce

    - script: |
        echo "Current directory:"
        pwd

        echo "Checked out repositories:"
        ls -la $(Pipeline.Workspace)

        echo "Infra repo:"
        ls -la $(Pipeline.Workspace)/s

        echo "App repo:"
        find $(Pipeline.Workspace) -maxdepth 2 -type d | head -30
      displayName: Verify Both Repositories


- stage: Bootstrap
  displayName: Bootstrap Terraform Backend
  dependsOn: ValidateRepos

  jobs:
  - job: BootstrapTerraform
    steps:
    - checkout: self
      path: s/infra

    - script: |
        sudo apt-get update
        sudo apt-get install -y gnupg software-properties-common curl

        curl -fsSL https://apt.releases.hashicorp.com/gpg \
          | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg

        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
        https://apt.releases.hashicorp.com \
        $(lsb_release -cs) main" \
          | sudo tee /etc/apt/sources.list.d/hashicorp.list

        sudo apt-get update
        sudo apt-get install -y terraform

        terraform version
      displayName: Install Terraform
      
    - task: AzureCLI@2
      name: bootstrapOutputs
      displayName: Resolve or Create Terraform Backend
      inputs:
        azureSubscription: '$(prodConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          SP_APP_ID=$(az account show --query user.name -o tsv)

          PIPELINE_PRINCIPAL_OBJECT_ID=$(az ad sp show \
            --id "$SP_APP_ID" \
            --query id \
            -o tsv)

          STORAGE_ACCOUNT=$(az storage account list \
            --query "[?tags.workload=='mavencrest' && tags.purpose=='terraform-state'].name | [0]" \
            -o tsv)

          TFSTATE_RG=$(az group list \
            --query "[?tags.workload=='mavencrest' && tags.purpose=='terraform-state'].name | [0]" \
            -o tsv)

          if [ -n "$STORAGE_ACCOUNT" ] && [ -n "$TFSTATE_RG" ]; then
            echo "Existing Terraform backend found."
            echo "Resource group: $TFSTATE_RG"
            echo "Storage account: $STORAGE_ACCOUNT"
          else
            echo "Terraform backend not found. Creating it..."

            cd $(Pipeline.Workspace)/s/infra/terraform/bootstrap

            echo "Current bootstrap directory:"
            pwd

            echo "Looking for pipeline_principal_object_id:"
            grep -R "pipeline_principal_object_id" . || true

            terraform init

            terraform plan \
              -var="pipeline_principal_object_id=$PIPELINE_PRINCIPAL_OBJECT_ID" \
              -out=bootstrap.tfplan

            terraform apply \
              -auto-approve \
              bootstrap.tfplan

            STORAGE_ACCOUNT=$(terraform output -raw storage_account_name)
            TFSTATE_RG=$(terraform output -raw resource_group_name)
          fi

          echo "##vso[task.setvariable variable=tfStateStorageAccount;isOutput=true]$STORAGE_ACCOUNT"
          echo "##vso[task.setvariable variable=tfStateResourceGroup;isOutput=true]$TFSTATE_RG"
          
- stage: Foundation
  displayName: Deploy Foundation
  dependsOn: Bootstrap

  variables:
   tfStateStorageAccount: $[ stageDependencies.Bootstrap.BootstrapTerraform.outputs['bootstrapOutputs.tfStateStorageAccount'] ]
   tfStateResourceGroup: $[ stageDependencies.Bootstrap.BootstrapTerraform.outputs['bootstrapOutputs.tfStateResourceGroup'] ]
    
  jobs:
  - job: TerraformFoundation
    steps:
    - checkout: self
      path: s/infra


    - script: |
        sudo apt-get update
        sudo apt-get install -y gnupg software-properties-common curl

        curl -fsSL https://apt.releases.hashicorp.com/gpg \
          | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg

        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
        https://apt.releases.hashicorp.com \
        $(lsb_release -cs) main" \
          | sudo tee /etc/apt/sources.list.d/hashicorp.list

        sudo apt-get update
        sudo apt-get install -y terraform

        terraform version
      displayName: Install Terraform


    - task: AzureCLI@2
      displayName: Terraform Foundation
      inputs:
        azureSubscription: '$(prodConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          export ARM_USE_CLI=true
          export ARM_USE_AZUREAD=true
          export ARM_TENANT_ID="$(az account show --query tenantId -o tsv)"

          echo "Verifying Entra ID access to Terraform state..."
          az storage blob list \
            --account-name "$(tfStateStorageAccount)" \
            --container-name "$(tfStateContainer)" \
            --auth-mode login \
            --num-results 1 \
            -o none

          terraform -chdir=$(Pipeline.Workspace)/s/infra/terraform/foundation init -reconfigure \
            -backend-config="storage_account_name=$(tfStateStorageAccount)" \
            -backend-config="container_name=$(tfStateContainer)" \
            -backend-config="key=$(foundationStateKey)" \
            -backend-config="tenant_id=$ARM_TENANT_ID" \
            -backend-config="use_cli=true" \
            -backend-config="use_azuread_auth=true"

          terraform -chdir=$(Pipeline.Workspace)/s/infra/terraform/foundation plan \
            -var-file="prod.tfvars" \
            -out=foundation.tfplan

          terraform -chdir=$(Pipeline.Workspace)/s/infra/terraform/foundation apply \
            -auto-approve \
            foundation.tfplan

- stage: BuildInitialImages
  displayName: Build Initial Images
  dependsOn: Foundation

  jobs:
  - job: BuildImages
    steps:
    - checkout: app
      path: s/E-commerce
    - task: AzureCLI@2
      displayName: Login to ACR
      inputs:
        azureSubscription: '$(prodConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name acrmavencrestprodzcjo

    - script: |
        cd $(Pipeline.Workspace)/s/E-commerce

        docker build \
          --platform linux/amd64 \
          -f apps/storefront/Dockerfile \
          -t acrmavencrestprodzcjo.azurecr.io/mavencrest-storefront:bootstrap \
          .

        docker push \
          acrmavencrestprodzcjo.azurecr.io/mavencrest-storefront:bootstrap
      displayName: Build Storefront

    - script: |
        cd $(Pipeline.Workspace)/s/E-commerce

        docker build \
          --platform linux/amd64 \
          -f apps/admin/Dockerfile \
          -t acrmavencrestprodzcjo.azurecr.io/mavencrest-admin:bootstrap \
          .

        docker push \
          acrmavencrestprodzcjo.azurecr.io/mavencrest-admin:bootstrap
      displayName: Build Admin

- stage: Workloads
  displayName: Deploy Workloads
  dependsOn: 
   - BuildInitialImages
   - Bootstrap

  variables:
   tfStateStorageAccount: $[ stageDependencies.Bootstrap.BootstrapTerraform.outputs['bootstrapOutputs.tfStateStorageAccount'] ]
   tfStateResourceGroup: $[ stageDependencies.Bootstrap.BootstrapTerraform.outputs['bootstrapOutputs.tfStateResourceGroup'] ]
   
  jobs: 
  - job: TerraformWorkloads
    steps:
    - checkout: self
      path: s/infra

    - script: |
        sudo apt-get update
        sudo apt-get install -y gnupg software-properties-common curl

        curl -fsSL https://apt.releases.hashicorp.com/gpg \
          | sudo gpg --dearmor -o /usr/share/keyrings/hashicorp-archive-keyring.gpg

        echo "deb [signed-by=/usr/share/keyrings/hashicorp-archive-keyring.gpg] \
        https://apt.releases.hashicorp.com \
        $(lsb_release -cs) main" \
          | sudo tee /etc/apt/sources.list.d/hashicorp.list

        sudo apt-get update
        sudo apt-get install -y terraform

        terraform version
      displayName: Install Terraform

    - task: AzureCLI@2
      displayName: Terraform Workloads
      inputs:
        azureSubscription: '$(prodConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail

          export ARM_USE_CLI=true
          export ARM_USE_AZUREAD=true
          export ARM_TENANT_ID="$(az account show --query tenantId -o tsv)"

          echo "Verifying Entra ID access to Terraform state..."
          az storage blob list \
            --account-name "$(tfStateStorageAccount)" \
            --container-name "$(tfStateContainer)" \
            --auth-mode login \
            --num-results 1 \
            -o none

          echo "Verifying remote-state configuration used by this run..."
          grep -nE "storage_account_name|container_name|use_cli|use_azuread_auth|use_oidc|resource_group_name" \
            $(Pipeline.Workspace)/s/infra/terraform/workload/remote-state.tf

          terraform -chdir=$(Pipeline.Workspace)/s/infra/terraform/workload init -reconfigure \
            -backend-config="storage_account_name=$(tfStateStorageAccount)" \
            -backend-config="container_name=$(tfStateContainer)" \
            -backend-config="key=$(workloadStateKey)" \
            -backend-config="tenant_id=$ARM_TENANT_ID" \
            -backend-config="use_cli=true" \
            -backend-config="use_azuread_auth=true"

          terraform -chdir=$(Pipeline.Workspace)/s/infra/terraform/workload plan \
            -var-file="prod.tfvars" \
            -var="tfstate_storage_account_name=$(tfStateStorageAccount)" \
            -var="tfstate_container_name=$(tfStateContainer)" \
            -out=workload.tfplan

          terraform -chdir=$(Pipeline.Workspace)/s/infra/terraform/workload apply \
            -auto-approve \
            workload.tfplan
            
- stage: ValidateDeployment
  displayName: Validate Deployment
  dependsOn: Workloads

  jobs:
  - job: HealthCheck
    steps:
     - script: |
        echo "Testing Storefront..."
        curl --fail \
        --retry 10 \
        --retry-delay 10 \
         https://store.az.mavencrest.site/api/health

         echo "Testing Admin..."
         curl --fail \
         --retry 10 \
         --retry-delay 10 \
         https://admin.az.mavencrest.site/api/health

         echo "Environment successfully rebuilt."
       displayName: Verify Production