trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  stagingConnection: 'mavencrest-staging-sc'
  prodConnection: 'mavencrest-prod-sc'

  acrName: 'acrmavencrestproda1wl'
  acrLoginServer: 'acrmavencrestproda1wl.azurecr.io'
  
  stagingResourceGroup: 'rg-mavencrest-staging'
  prodResourceGroup: 'rg-mavencrest-prod'

  storefrontImageName: 'mavencrest-storefront'
  storefrontContainerApp: 'ca-mavencrest-prod-storefront'
  storefrontStagingContainerApp: 'ca-mavencrest-staging-storefront'

  adminImageName: 'mavencrest-admin'
  adminContainerApp: 'ca-mavencrest-prod-admin'
  adminStagingContainerApp: 'ca-mavencrest-staging-admin'

  imageTag: '$(Build.BuildId)'

stages:

- stage: Test
  displayName: Test Application

  jobs:
  - job: TestApplication
    displayName: Test and Validate

    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: Use Node.js 22
      inputs:
        versionSpec: '22.x'

    - script: npm ci
      displayName: Install Dependencies

    - script: npm run db:generate
      displayName: Generate Prisma Client

    - script: npm run build:store
      displayName: Build Storefront

    - script: npm run build:admin
      displayName: Build Admin


- stage: Build
  displayName: Build and Push
  dependsOn: Test
  condition: succeeded()

  jobs:
  - job: BuildImages
    displayName: Build Container Images

    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: Login to ACR
      inputs:
        azureSubscription: '$(prodConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          set -euo pipefail
          az acr login --name $(acrName)

    - task: CmdLine@2
      displayName: Install Trivy
      inputs:
        script: |
          set -euo pipefail
          curl -sfL \
            https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh \
            | sh -s -- -b /usr/local/bin

    - task: CmdLine@2
      displayName: Set Up Multi-Platform Builder
      inputs:
        script: |
          set -euo pipefail

          docker run --privileged --rm tonistiigi/binfmt --install arm64

          docker buildx create \
            --name mavencrest-multi \
            --driver docker-container \
            --use

          docker buildx inspect --bootstrap

    - task: CmdLine@2
      displayName: Build and Push Storefront AMD64 and ARM64
      inputs:
        script: |
          set -euo pipefail

          docker buildx build \
            --platform linux/amd64,linux/arm64 \
            --file apps/storefront/Dockerfile \
            --tag $(acrLoginServer)/$(storefrontImageName):$(imageTag) \
            --cache-from type=registry,ref=$(acrLoginServer)/$(storefrontImageName):buildcache \
            --cache-to type=registry,ref=$(acrLoginServer)/$(storefrontImageName):buildcache,mode=max \
            --push \
            .

    - task: CmdLine@2
      displayName: Scan Both Storefront Architectures
      inputs:
        script: |
          set -euo pipefail

          for platform in linux/amd64 linux/arm64; do
            trivy image \
              --platform "$platform" \
              --severity HIGH,CRITICAL \
              --exit-code 0 \
              $(acrLoginServer)/$(storefrontImageName):$(imageTag)
          done

    # ADMIN: BUILD -> SCAN -> PUSH
    - script: |
        set -euo pipefail
        
        docker pull $(acrLoginServer)/$(adminImageName):latest || true
        docker build \
          --platform linux/amd64 \
          --cache-from $(acrLoginServer)/$(adminImageName):latest \
          -f apps/admin/Dockerfile \
          -t $(acrLoginServer)/$(adminImageName):$(imageTag) \
          -t $(acrLoginServer)/$(adminImageName):latest \
          .
      displayName: Build Admin Docker Image (Cached)

    - script: |
        trivy image --severity HIGH,CRITICAL --exit-code 0 $(acrLoginServer)/$(adminImageName):$(imageTag)
      displayName: Scan Admin Image with Trivy

    - script: |
        docker push $(acrLoginServer)/$(adminImageName):$(imageTag)
        docker push $(acrLoginServer)/$(adminImageName):latest
      displayName: Push Admin Image & Cache Tag to ACR


- stage: DeployStaging
  displayName: Deploy Staging
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - deployment: DeployStaging
    displayName: Deploy Container Apps to Staging
    environment: Staging

    strategy:
      runOnce:
        deploy:
          steps:

          - task: AzureCLI@2
            displayName: Deploy Storefront to Staging
            inputs:
              azureSubscription: '$(stagingConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp update \
                  --name $(storefrontStagingContainerApp) \
                  --resource-group $(stagingResourceGroup) \
                  --image $(acrLoginServer)/$(storefrontImageName):$(imageTag)

          - task: AzureCLI@2
            displayName: Deploy Admin to Staging
            inputs:
              azureSubscription: '$(stagingConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp update \
                  --name $(adminStagingContainerApp) \
                  --resource-group $(stagingResourceGroup) \
                  --image $(acrLoginServer)/$(adminImageName):$(imageTag)


- stage: SmokeTestStaging
  displayName: Smoke Test Staging
  dependsOn: DeployStaging
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - job: SmokeTest
    displayName: Validate Staging

    steps:
    - task: AzureCLI@2
      displayName: Smoke Test Staging Apps
      inputs:
        azureSubscription: '$(stagingConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          STOREFRONT_URL=$(az containerapp show \
            --name $(storefrontStagingContainerApp) \
            --resource-group $(stagingResourceGroup) \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          ADMIN_URL=$(az containerapp show \
            --name $(adminStagingContainerApp) \
            --resource-group $(stagingResourceGroup) \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          echo "Testing Storefront staging..."
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            "https://$STOREFRONT_URL"

          echo "Testing Admin staging..."
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            "https://$ADMIN_URL"

          echo "Staging smoke tests passed."

          
- stage: DeployProd
  displayName: Deploy Production
  dependsOn: SmokeTestStaging
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - deployment: Deploy
    displayName: Deploy and Verify Production
    environment: Prod
    strategy:
      runOnce:
        deploy:
          steps:
          - task: AzureCLI@2
            displayName: Deploy with Verified Rollback
            inputs:
              azureSubscription: '$(prodConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -euo pipefail

                RG="$(prodResourceGroup)"
                STORE="$(storefrontContainerApp)"
                ADMIN="$(adminContainerApp)"
                SUFFIX="b$(Build.BuildId)-a$(System.JobAttempt)"
                STORE_NEW="${STORE}--${SUFFIX}"
                ADMIN_NEW="${ADMIN}--${SUFFIX}"

                # Require exactly one revision serving 100% traffic.
                current_revision() {
                  local app="$1"
                  local revisions count
                  revisions=$(az containerapp revision list \
                    --name "$app" --resource-group "$RG" -o json)

                  count=$(jq '[.[] | select(.properties.trafficWeight > 0)] | length' \
                    <<< "$revisions")

                  if [ "$count" != "1" ]; then
                    echo "Expected one live revision for $app; found $count." >&2
                    return 1
                  fi

                  jq -er \
                    '.[] | select(.properties.trafficWeight == 100) | .name' \
                    <<< "$revisions"
                }

                set_traffic() {
                  az containerapp ingress traffic set \
                    --name "$1" \
                    --resource-group "$RG" \
                    --revision-weight "$2=100" \
                    --output none
                }

                # Retry exact HTTP 200 checks with bounded request time.
                check_health() {
                  local url="$1" code
                  for attempt in {1..30}; do
                    code=$(curl --silent --show-error \
                      --connect-timeout 10 --max-time 20 \
                      --output /dev/null --write-out '%{http_code}' \
                      "$url") || code="000"

                    if [ "$code" = "200" ]; then
                      echo "Healthy: $url"
                      return 0
                    fi

                    echo "Health attempt $attempt: HTTP $code"
                    sleep 10
                  done
                  return 1
                }

                revision_url() {
                  local fqdn
                  fqdn=$(az containerapp revision show \
                    --name "$1" \
                    --resource-group "$RG" \
                    --revision "$2" \
                    --query properties.fqdn -o tsv)

                  if [ -z "$fqdn" ] || [ "$fqdn" = "None" ]; then
                    return 1
                  fi
                  printf 'https://%s/api/health' "$fqdn"
                }

                STORE_GOOD=$(current_revision "$STORE")
                ADMIN_GOOD=$(current_revision "$ADMIN")

                echo "Current storefront: $STORE_GOOD"
                echo "Current admin: $ADMIN_GOOD"

                # Confirm the baseline is healthy before changing anything.
                check_health "https://store.az.mavencrest.site/api/health"
                check_health "https://admin.az.mavencrest.site/api/health"

                # Restore both apps on any subsequent script failure.
                rollback_on_exit() {
                  local status=$?
                  trap - EXIT

                  if [ "$status" -eq 0 ]; then
                    return
                  fi

                  set +e
                  echo "Deployment failed. Restoring previous traffic."

                  local rollback_failed=0
                  set_traffic "$STORE" "$STORE_GOOD" || rollback_failed=1
                  set_traffic "$ADMIN" "$ADMIN_GOOD" || rollback_failed=1

                  check_health "https://store.az.mavencrest.site/api/health" \
                    || rollback_failed=1
                  check_health "https://admin.az.mavencrest.site/api/health" \
                    || rollback_failed=1

                  if [ "$rollback_failed" -eq 0 ]; then
                    echo "Rollback verified. Previous releases are serving."
                  else
                    echo "ERROR: Rollback could not be fully verified."
                  fi

                  exit "$status"
                }
                trap rollback_on_exit EXIT

                # Replace any 'latest revision' rule with explicit revisions.
                set_traffic "$STORE" "$STORE_GOOD"
                set_traffic "$ADMIN" "$ADMIN_GOOD"

                # Create named candidate revisions; keep current traffic pinned.
                az containerapp update \
                  --name "$STORE" \
                  --resource-group "$RG" \
                  --container-name storefront \
                  --image "$(acrLoginServer)/$(storefrontImageName):$(imageTag)" \
                  --revision-suffix "$SUFFIX" \
                  --output none

                az containerapp update \
                  --name "$ADMIN" \
                  --resource-group "$RG" \
                  --container-name admin \
                  --image "$(acrLoginServer)/$(adminImageName):$(imageTag)" \
                  --revision-suffix "$SUFFIX" \
                  --output none

                # Test candidates directly, including scale-from-zero startup.
                STORE_URL=$(revision_url "$STORE" "$STORE_NEW")
                ADMIN_URL=$(revision_url "$ADMIN" "$ADMIN_NEW")

                check_health "$STORE_URL"
                check_health "$ADMIN_URL"

                # Promote only after both candidates pass.
                set_traffic "$STORE" "$STORE_NEW"
                set_traffic "$ADMIN" "$ADMIN_NEW"

                # A failed public check also triggers rollback.
                check_health "https://store.az.mavencrest.site/api/health"
                check_health "https://admin.az.mavencrest.site/api/health"

                echo "Production deployment verified."
                echo "Storefront: $STORE_NEW"
                echo "Admin: $ADMIN_NEW"