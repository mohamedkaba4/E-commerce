trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  stagingConnection: 'sc-mcrest-staging'
  prodConnection: 'sc-mcrest-prod'

  acrName: 'acrmavencrestprodzcjo'
  acrLoginServer: 'acrmavencrestprodzcjo.azurecr.io'
  
  stagingResourceGroup: 'rg-mavencrest-staging'
  prodResourceGroup: 'rg-mavencrest-prod'

  storefrontImageName: 'mavencrest-storefront'
  storefrontContainerApp: 'ca-mavencrest-prod-storefront'
  storefrontStagingContainerApp: 'ca-mavencrest-staging-storefront'

  adminImageName: 'mavencrest-admin'
  adminContainerApp: 'ca-mavencrest-prod-admin'
  adminStagingContainerApp: 'ca-mavencrest-staging-admin'

  imageTag: '$(Build.BuildId)'

stages:

- stage: Test
  displayName: Test Application

  jobs:
  - job: TestApplication
    displayName: Test and Validate

    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: Use Node.js 22
      inputs:
        versionSpec: '22.x'

    - script: npm ci
      displayName: Install Dependencies

    - script: npm run db:generate
      displayName: Generate Prisma Client

    - script: npm run build:store
      displayName: Build Storefront

    - script: npm run build:admin
      displayName: Build Admin


- stage: Build
  displayName: Build and Push
  dependsOn: Test
  condition: succeeded()

  jobs:
  - job: BuildImages
    displayName: Build Container Images

    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: Login to ACR
      inputs:
        azureSubscription: '$(prodConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(acrName)

    # INSTALL TRIVY SCANNER
    - script: |
        echo "Installing Trivy Vulnerability Scanner..."
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      displayName: Install Trivy

    # STOREFRONT: BUILD -> SCAN -> PUSH
    - script: |
        docker pull $(acrLoginServer)/$(storefrontImageName):latest || true
        docker build \
          --platform linux/amd64 \
          --cache-from $(acrLoginServer)/$(storefrontImageName):latest \
          -f apps/storefront/Dockerfile \
          -t $(acrLoginServer)/$(storefrontImageName):$(imageTag) \
          -t $(acrLoginServer)/$(storefrontImageName):latest \
          .
      displayName: Build Storefront Docker Image (Cached)

    - script: |
        trivy image --severity HIGH,CRITICAL --exit-code 0 $(acrLoginServer)/$(storefrontImageName):$(imageTag)
      displayName: Scan Storefront Image with Trivy

    - script: |
        docker push $(acrLoginServer)/$(storefrontImageName):$(imageTag)
        docker push $(acrLoginServer)/$(storefrontImageName):latest
      displayName: Push Storefront Image & Cache Tag to ACR

    # ADMIN: BUILD -> SCAN -> PUSH
    - script: |
        docker pull $(acrLoginServer)/$(adminImageName):latest || true
        docker build \
          --platform linux/amd64 \
          --cache-from $(acrLoginServer)/$(adminImageName):latest \
          -f apps/admin/Dockerfile \
          -t $(acrLoginServer)/$(adminImageName):$(imageTag) \
          -t $(acrLoginServer)/$(adminImageName):latest \
          .
      displayName: Build Admin Docker Image (Cached)

    - script: |
        trivy image --severity HIGH,CRITICAL --exit-code 0 $(acrLoginServer)/$(adminImageName):$(imageTag)
      displayName: Scan Admin Image with Trivy

    - script: |
        docker push $(acrLoginServer)/$(adminImageName):$(imageTag)
        docker push $(acrLoginServer)/$(adminImageName):latest
      displayName: Push Admin Image & Cache Tag to ACR


- stage: DeployStaging
  displayName: Deploy Staging
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - deployment: DeployStaging
    displayName: Deploy Container Apps to Staging
    environment: Staging

    strategy:
      runOnce:
        deploy:
          steps:

          - task: AzureCLI@2
            displayName: Deploy Storefront to Staging
            inputs:
              azureSubscription: '$(stagingConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp update \
                  --name $(storefrontStagingContainerApp) \
                  --resource-group $(stagingResourceGroup) \
                  --image $(acrLoginServer)/$(storefrontImageName):$(imageTag)

          - task: AzureCLI@2
            displayName: Deploy Admin to Staging
            inputs:
              azureSubscription: '$(stagingConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp update \
                  --name $(adminStagingContainerApp) \
                  --resource-group $(stagingResourceGroup) \
                  --image $(acrLoginServer)/$(adminImageName):$(imageTag)


- stage: SmokeTestStaging
  displayName: Smoke Test Staging
  dependsOn: DeployStaging
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - job: SmokeTest
    displayName: Validate Staging

    steps:
    - task: AzureCLI@2
      displayName: Smoke Test Staging Apps
      inputs:
        azureSubscription: '$(stagingConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          STOREFRONT_URL=$(az containerapp show \
            --name $(storefrontStagingContainerApp) \
            --resource-group $(stagingResourceGroup) \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          ADMIN_URL=$(az containerapp show \
            --name $(adminStagingContainerApp) \
            --resource-group $(stagingResourceGroup) \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          echo "Testing Storefront staging..."
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            "https://$STOREFRONT_URL"

          echo "Testing Admin staging..."
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            "https://$ADMIN_URL"

          echo "Staging smoke tests passed."

          
- stage: DeployProd
  displayName: Deploy Production
  dependsOn: SmokeTestStaging
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - deployment: Deploy
    displayName: Deploy Container Apps
    environment: Prod

    strategy:
      runOnce:
        deploy:
          steps:

          - task: AzureCLI@2
            displayName: Deploy Storefront to Production
            inputs:
              azureSubscription: '$(prodConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp update \
                  --name $(storefrontContainerApp) \
                  --resource-group $(prodResourceGroup) \
                  --image $(acrLoginServer)/$(storefrontImageName):$(imageTag)

          - task: AzureCLI@2
            displayName: Deploy Admin to Production
            inputs:
              azureSubscription: '$(prodConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp update \
                  --name $(adminContainerApp) \
                  --resource-group $(prodResourceGroup) \
                  --image $(acrLoginServer)/$(adminImageName):$(imageTag)

          # HEALTH CHECK & AUTOMATED ROLLBACK
          - task: AzureCLI@2
            displayName: Production Health Check & Rollback
            inputs:
              azureSubscription: '$(prodConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                echo "Validating Production endpoints..."

                STORE_STATUS=$(curl -L --write-out "%{http_code}" --silent --output /dev/null --retry 3 --retry-delay 5 "https://store.az.mavencrest.site/api/health")
                ADMIN_STATUS=$(curl -L --write-out "%{http_code}" --silent --output /dev/null --retry 3 --retry-delay 5 "https://admin.az.mavencrest.site/api/health")

                if [ "$STORE_STATUS" -ne 200 ] || [ "$ADMIN_STATUS" -ne 200 ]; then
                  echo "CRITICAL: Health check failed (Storefront HTTP: $STORE_STATUS, Admin HTTP: $ADMIN_STATUS)."
                  echo "Initiating automated rollback..."

                  # --- STOREFRONT ROLLBACK ---
                  BROKEN_STORE_REV=$(az containerapp revision list --name $(storefrontContainerApp) --resource-group $(prodResourceGroup) --query "[?properties.active==\`true\`] | [-1].name" -o tsv)
                  PREV_STORE_REV=$(az containerapp revision list --name $(storefrontContainerApp) --resource-group $(prodResourceGroup) --query "[?properties.active==\`false\`] | [-1].name" -o tsv)

                  if [ -n "$PREV_STORE_REV" ]; then
                    echo "Reverting Storefront traffic to revision: $PREV_STORE_REV"
                    az containerapp revision activate --name $(storefrontContainerApp) --resource-group $(prodResourceGroup) --revision $PREV_STORE_REV
                    az containerapp ingress traffic set --name $(storefrontContainerApp) --resource-group $(prodResourceGroup) --revision-weight $PREV_STORE_REV=100
                    az containerapp revision deactivate --name $(storefrontContainerApp) --resource-group $(prodResourceGroup) --revision $BROKEN_STORE_REV
                  fi

                  # --- ADMIN ROLLBACK ---
                  BROKEN_ADMIN_REV=$(az containerapp revision list --name $(adminContainerApp) --resource-group $(prodResourceGroup) --query "[?properties.active==\`true\`] | [-1].name" -o tsv)
                  PREV_ADMIN_REV=$(az containerapp revision list --name $(adminContainerApp) --resource-group $(prodResourceGroup) --query "[?properties.active==\`false\`] | [-1].name" -o tsv)

                  if [ -n "$PREV_ADMIN_REV" ]; then
                    echo "Reverting Admin traffic to revision: $PREV_ADMIN_REV"
                    az containerapp revision activate --name $(adminContainerApp) --resource-group $(prodResourceGroup) --revision $PREV_ADMIN_REV
                    az containerapp ingress traffic set --name $(adminContainerApp) --resource-group $(prodResourceGroup) --revision-weight $PREV_ADMIN_REV=100
                    az containerapp revision deactivate --name $(adminContainerApp) --resource-group $(prodResourceGroup) --revision $BROKEN_ADMIN_REV
                  fi

                  exit 1
                fi

                echo "Production health check passed successfully."