trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'mc-connection'
  acrName: 'acrmavencrestprodg0rn'
  acrLoginServer: 'acrmavencrestprodg0rn.azurecr.io'
  resourceGroup: 'rg-mavencrest-prod'

  storefrontImageName: 'mavencrest-storefront'
  storefrontContainerApp: 'ca-mavencrest-prod-storefront'
  storefrontStagingContainerApp: 'ca-mavencrest-staging-storefront'

  adminImageName: 'mavencrest-admin'
  adminContainerApp: 'ca-mavencrest-prod-admin'
  adminStagingContainerApp: 'ca-mavencrest-staging-admin'

  imageTag: '$(Build.BuildId)'

stages:

- stage: Test
  displayName: Test Application

  jobs:
  - job: TestApplication
    displayName: Test and Validate

    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: Use Node.js 22
      inputs:
        versionSpec: '22.x'

    - script: npm ci
      displayName: Install Dependencies

    - script: npm run db:generate
      displayName: Generate Prisma Client

    - script: npm run build:store
      displayName: Build Storefront

    - script: npm run build:admin
      displayName: Build Admin


- stage: Build
  displayName: Build and Push
  dependsOn: Test
  condition: succeeded()

  jobs:
  - job: BuildImages
    displayName: Build Container Images

    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: Login to ACR
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(acrName)

    - script: |
        docker build \
          --platform linux/amd64 \
          -f apps/storefront/Dockerfile \
          -t $(acrLoginServer)/$(storefrontImageName):$(imageTag) \
          .
      displayName: Build Storefront Docker Image

    - script: |
        docker push \
          $(acrLoginServer)/$(storefrontImageName):$(imageTag)
      displayName: Push Storefront Image to ACR

    - script: |
        docker build \
          --platform linux/amd64 \
          -f apps/admin/Dockerfile \
          -t $(acrLoginServer)/$(adminImageName):$(imageTag) \
          .
      displayName: Build Admin Docker Image

    - script: |
        docker push \
          $(acrLoginServer)/$(adminImageName):$(imageTag)
      displayName: Push Admin Image to ACR

- stage: DeployStaging
  displayName: Deploy Staging
  dependsOn: Build
  condition: succeeded()

  jobs:
  - deployment: DeployStaging
    displayName: Deploy Container Apps to Staging
    environment: Staging

    strategy:
      runOnce:
        deploy:
          steps:

          - task: AzureCLI@2
            displayName: Deploy Storefront to Staging
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp update \
                  --name $(storefrontStagingContainerApp) \
                  --resource-group $(resourceGroup) \
                  --image $(acrLoginServer)/$(storefrontImageName):$(imageTag)

          - task: AzureCLI@2
            displayName: Deploy Admin to Staging
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp update \
                  --name $(adminStagingContainerApp) \
                  --resource-group $(resourceGroup) \
                  --image $(acrLoginServer)/$(adminImageName):$(imageTag)

                  
- stage: DeployProd
  displayName: Deploy Production
  dependsOn: DeployStaging
  condition: succeeded()

  jobs:
  - deployment: Deploy
    displayName: Deploy Container Apps
    environment: Prod

    strategy:
      runOnce:
        deploy:
          steps:

          - task: AzureCLI@2
            displayName: Deploy Storefront
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp update \
                  --name $(storefrontContainerApp) \
                  --resource-group $(resourceGroup) \
                  --image $(acrLoginServer)/$(storefrontImageName):$(imageTag)

          - task: AzureCLI@2
            displayName: Deploy Admin
            inputs:
              azureSubscription: '$(azureServiceConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp update \
                  --name $(adminContainerApp) \
                  --resource-group $(resourceGroup) \
                  --image $(acrLoginServer)/$(adminImageName):$(imageTag)