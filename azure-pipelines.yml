trigger:
  branches:
    include:
      - main

pr:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  stagingConnection: 'sc-mcrest-staging'
  prodConnection: 'sc-mcrest-prod'

  acrName: 'acrmavencrestprodzcjo'
  acrLoginServer: 'acrmavencrestprodzcjo.azurecr.io'
  
  stagingResourceGroup: 'rg-mavencrest-staging'
  prodResourceGroup: 'rg-mavencrest-prod'

  storefrontImageName: 'mavencrest-storefront'
  storefrontContainerApp: 'ca-mavencrest-prod-storefront'
  storefrontStagingContainerApp: 'ca-mavencrest-staging-storefront'

  adminImageName: 'mavencrest-admin'
  adminContainerApp: 'ca-mavencrest-prod-admin'
  adminStagingContainerApp: 'ca-mavencrest-staging-admin'

  imageTag: '$(Build.BuildId)'

stages:

- stage: Test
  displayName: Test Application

  jobs:
  - job: TestApplication
    displayName: Test and Validate

    steps:
    - checkout: self

    - task: NodeTool@0
      displayName: Use Node.js 22
      inputs:
        versionSpec: '22.x'

    - script: npm ci
      displayName: Install Dependencies

    - script: npm run db:generate
      displayName: Generate Prisma Client

    - script: npm run build:store
      displayName: Build Storefront

    - script: npm run build:admin
      displayName: Build Admin


- stage: Build
  displayName: Build and Push
  dependsOn: Test
  condition: succeeded()

  jobs:
  - job: BuildImages
    displayName: Build Container Images

    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: Login to ACR
      inputs:
        azureSubscription: '$(prodConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(acrName)

    # INSTALL TRIVY SCANNER
    - script: |
        echo "Installing Trivy Vulnerability Scanner..."
        curl -sfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sh -s -- -b /usr/local/bin
      displayName: Install Trivy

    # STOREFRONT: BUILD -> SCAN -> PUSH
    - script: |
        docker pull $(acrLoginServer)/$(storefrontImageName):latest || true
        docker build \
          --platform linux/amd64 \
          --cache-from $(acrLoginServer)/$(storefrontImageName):latest \
          -f apps/storefront/Dockerfile \
          -t $(acrLoginServer)/$(storefrontImageName):$(imageTag) \
          -t $(acrLoginServer)/$(storefrontImageName):latest \
          .
      displayName: Build Storefront Docker Image (Cached)

    - script: |
        trivy image --severity HIGH,CRITICAL --exit-code 0 $(acrLoginServer)/$(storefrontImageName):$(imageTag)
      displayName: Scan Storefront Image with Trivy

    - script: |
        docker push $(acrLoginServer)/$(storefrontImageName):$(imageTag)
        docker push $(acrLoginServer)/$(storefrontImageName):latest
      displayName: Push Storefront Image & Cache Tag to ACR

    # ADMIN: BUILD -> SCAN -> PUSH
    - script: |
        docker pull $(acrLoginServer)/$(adminImageName):latest || true
        docker build \
          --platform linux/amd64 \
          --cache-from $(acrLoginServer)/$(adminImageName):latest \
          -f apps/admin/Dockerfile \
          -t $(acrLoginServer)/$(adminImageName):$(imageTag) \
          -t $(acrLoginServer)/$(adminImageName):latest \
          .
      displayName: Build Admin Docker Image (Cached)

    - script: |
        trivy image --severity HIGH,CRITICAL --exit-code 0 $(acrLoginServer)/$(adminImageName):$(imageTag)
      displayName: Scan Admin Image with Trivy

    - script: |
        docker push $(acrLoginServer)/$(adminImageName):$(imageTag)
        docker push $(acrLoginServer)/$(adminImageName):latest
      displayName: Push Admin Image & Cache Tag to ACR


- stage: DeployStaging
  displayName: Deploy Staging
  dependsOn: Build
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - deployment: DeployStaging
    displayName: Deploy Container Apps to Staging
    environment: Staging

    strategy:
      runOnce:
        deploy:
          steps:

          - task: AzureCLI@2
            displayName: Deploy Storefront to Staging
            inputs:
              azureSubscription: '$(stagingConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp update \
                  --name $(storefrontStagingContainerApp) \
                  --resource-group $(stagingResourceGroup) \
                  --image $(acrLoginServer)/$(storefrontImageName):$(imageTag)

          - task: AzureCLI@2
            displayName: Deploy Admin to Staging
            inputs:
              azureSubscription: '$(stagingConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                az containerapp update \
                  --name $(adminStagingContainerApp) \
                  --resource-group $(stagingResourceGroup) \
                  --image $(acrLoginServer)/$(adminImageName):$(imageTag)


- stage: SmokeTestStaging
  displayName: Smoke Test Staging
  dependsOn: DeployStaging
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - job: SmokeTest
    displayName: Validate Staging

    steps:
    - task: AzureCLI@2
      displayName: Smoke Test Staging Apps
      inputs:
        azureSubscription: '$(stagingConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          STOREFRONT_URL=$(az containerapp show \
            --name $(storefrontStagingContainerApp) \
            --resource-group $(stagingResourceGroup) \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          ADMIN_URL=$(az containerapp show \
            --name $(adminStagingContainerApp) \
            --resource-group $(stagingResourceGroup) \
            --query properties.configuration.ingress.fqdn \
            -o tsv)

          echo "Testing Storefront staging..."
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            "https://$STOREFRONT_URL"

          echo "Testing Admin staging..."
          curl --fail --silent --show-error \
            --retry 5 \
            --retry-delay 5 \
            "https://$ADMIN_URL"

          echo "Staging smoke tests passed."

          
- stage: DeployProd
  displayName: Deploy Production
  dependsOn: SmokeTestStaging
  condition: and(succeeded(), eq(variables['Build.SourceBranch'], 'refs/heads/main'))

  jobs:
  - deployment: Deploy
    displayName: Deploy Container Apps
    environment: Prod

    strategy:
      runOnce:
        deploy:
          steps:

          - task: AzureCLI@2
            displayName: Deploy Production with Automatic Rollback
            inputs:
              azureSubscription: '$(prodConnection)'
              scriptType: bash
              scriptLocation: inlineScript
              inlineScript: |
                set -e

                echo "=========================================="
                echo "CAPTURING CURRENT PRODUCTION REVISIONS"
                echo "=========================================="

                STORE_GOOD_REV=$(az containerapp show \
                  --name $(storefrontContainerApp) \
                  --resource-group $(prodResourceGroup) \
                  --query "properties.latestRevisionName" \
                  -o tsv)

                ADMIN_GOOD_REV=$(az containerapp show \
                  --name $(adminContainerApp) \
                  --resource-group $(prodResourceGroup) \
                  --query "properties.latestRevisionName" \
                  -o tsv)

                 echo "Previous Storefront revision: $STORE_GOOD_REV"
                 echo "Previous Admin revision:      $ADMIN_GOOD_REV"

                 if [ -z "$STORE_GOOD_REV" ]; then
                  echo "ERROR: Could not determine current Storefront revision."
                  exit 1
                fi

                if [ -z "$ADMIN_GOOD_REV" ]; then
                  echo "ERROR: Could not determine current Admin revision."
                  exit 1
                fi


                echo "=========================================="
                echo "DEPLOYING NEW PRODUCTION REVISIONS"
                echo "=========================================="

                az containerapp update \
                  --name $(storefrontContainerApp) \
                  --resource-group $(prodResourceGroup) \
                  --image $(acrLoginServer)/$(storefrontImageName):$(imageTag)

                az containerapp update \
                  --name $(adminContainerApp) \
                  --resource-group $(prodResourceGroup) \
                  --image $(acrLoginServer)/$(adminImageName):$(imageTag)


                echo "=========================================="
                echo "DETERMINING NEW REVISIONS"
                echo "=========================================="

                STORE_NEW_REV=$(az containerapp revision list \
                  --name $(storefrontContainerApp) \
                  --resource-group $(prodResourceGroup) \
                  --query "sort_by(@, &properties.createdTime)[-1].name" \
                  -o tsv)

                ADMIN_NEW_REV=$(az containerapp revision list \
                  --name $(adminContainerApp) \
                  --resource-group $(prodResourceGroup) \
                  --query "sort_by(@, &properties.createdTime)[-1].name" \
                  -o tsv)

                echo "New Storefront revision: $STORE_NEW_REV"
                echo "New Admin revision:      $ADMIN_NEW_REV"


                echo "=========================================="
                echo "WAITING FOR NEW REVISIONS"
                echo "=========================================="

                echo "Waiting for Storefront revision..."
                for i in {1..30}; do

                  STORE_STATE=$(az containerapp revision show \
                    --name $(storefrontContainerApp) \
                    --resource-group $(prodResourceGroup) \
                    --revision "$STORE_NEW_REV" \
                    --query "properties.runningState" \
                    -o tsv)

                  echo "Storefront state: $STORE_STATE"

                  if [ "$STORE_STATE" = "Running" ]; then
                    break
                  fi

                  if [ "$STORE_STATE" = "Failed" ]; then
                    echo "Storefront revision failed to start."
                    break
                  fi

                  sleep 10
                done


                echo "Waiting for Admin revision..."
                for i in {1..30}; do

                  ADMIN_STATE=$(az containerapp revision show \
                    --name $(adminContainerApp) \
                    --resource-group $(prodResourceGroup) \
                    --revision "$ADMIN_NEW_REV" \
                    --query "properties.runningState" \
                    -o tsv)

                  echo "Admin state: $ADMIN_STATE"

                  if [ "$ADMIN_STATE" = "Running" ]; then
                    break
                  fi

                  if [ "$ADMIN_STATE" = "Failed" ]; then
                    echo "Admin revision failed to start."
                    break
                  fi

                  sleep 10
                done

                  if [ "$STORE_STATE" != "Running" ] || [ "$ADMIN_STATE" != "Running" ]; then
                  echo "ERROR: One or more new revisions failed to reach Running state."

                  STORE_STATUS="000"
                  ADMIN_STATUS="000"

                else

                  echo "=========================================="
                  echo "TESTING NEW REVISIONS DIRECTLY"
                  echo "=========================================="

                  STORE_NEW_FQDN=$(az containerapp revision show \
                    --name $(storefrontContainerApp) \
                    --resource-group $(prodResourceGroup) \
                    --revision "$STORE_NEW_REV" \
                    --query "properties.fqdn" \
                    -o tsv)

                  ADMIN_NEW_FQDN=$(az containerapp revision show \
                    --name $(adminContainerApp) \
                    --resource-group $(prodResourceGroup) \
                    --revision "$ADMIN_NEW_REV" \
                    --query "properties.fqdn" \
                    -o tsv)

                  echo "Storefront revision: $STORE_NEW_FQDN"
                  echo "Admin revision:      $ADMIN_NEW_FQDN"

                  STORE_STATUS=$(curl \
                    -L \
                    --write-out "%{http_code}" \
                    --silent \
                    --output /dev/null \
                    --retry 3 \
                    --retry-delay 5 \
                    "https://$STORE_NEW_FQDN/api/health" || true)

                  ADMIN_STATUS=$(curl \
                    -L \
                    --write-out "%{http_code}" \
                    --silent \
                    --output /dev/null \
                    --retry 3 \
                    --retry-delay 5 \
                    "https://$ADMIN_NEW_FQDN/api/health" || true)

                fi

                echo "New Storefront revision status: $STORE_STATUS"
                echo "New Admin revision status:      $ADMIN_STATUS"


                if [ "$STORE_STATUS" != "200" ] || [ "$ADMIN_STATUS" != "200" ]; then

                  echo "=========================================="
                  echo "NEW REVISION HEALTH CHECK FAILED"
                  echo "ROLLING BACK"
                  echo "=========================================="

                  echo "Activating previous Storefront revision..."
                  az containerapp revision activate \
                    --name $(storefrontContainerApp) \
                    --resource-group $(prodResourceGroup) \
                    --revision "$STORE_GOOD_REV"

                  echo "Activating previous Admin revision..."
                  az containerapp revision activate \
                    --name $(adminContainerApp) \
                    --resource-group $(prodResourceGroup) \
                    --revision "$ADMIN_GOOD_REV"


                  echo "=========================================="
                  echo "RESTORING PRODUCTION TRAFFIC"
                  echo "=========================================="

                  az containerapp ingress traffic set \
                    --name $(storefrontContainerApp) \
                    --resource-group $(prodResourceGroup) \
                    --revision-weight "$STORE_GOOD_REV=100"

                  az containerapp ingress traffic set \
                    --name $(adminContainerApp) \
                    --resource-group $(prodResourceGroup) \
                    --revision-weight "$ADMIN_GOOD_REV=100"

                  echo "Waiting for rollback traffic..."
                  sleep 15


                  echo "=========================================="
                  echo "VERIFYING ROLLBACK"
                  echo "=========================================="

                  STORE_ROLLBACK_STATUS=$(curl \
                    -L \
                    --write-out "%{http_code}" \
                    --silent \
                    --output /dev/null \
                    --retry 5 \
                    --retry-delay 5 \
                    "https://store.az.mavencrest.site/api/health" || true)

                  ADMIN_ROLLBACK_STATUS=$(curl \
                    -L \
                    --write-out "%{http_code}" \
                    --silent \
                    --output /dev/null \
                    --retry 5 \
                    --retry-delay 5 \
                    "https://admin.az.mavencrest.site/api/health" || true)

                  echo "Storefront after rollback: $STORE_ROLLBACK_STATUS"
                  echo "Admin after rollback:      $ADMIN_ROLLBACK_STATUS"


                  if [ "$STORE_ROLLBACK_STATUS" = "200" ] && \
                     [ "$ADMIN_ROLLBACK_STATUS" = "200" ]; then

                    echo "=========================================="
                    echo "ROLLBACK VERIFIED"
                    echo "PRODUCTION IS HEALTHY"
                    echo "=========================================="

                    if [ "$STORE_NEW_REV" != "$STORE_GOOD_REV" ]; then
                      az containerapp revision deactivate \
                        --name $(storefrontContainerApp) \
                        --resource-group $(prodResourceGroup) \
                        --revision "$STORE_NEW_REV" || true
                    fi

                    if [ "$ADMIN_NEW_REV" != "$ADMIN_GOOD_REV" ]; then
                      az containerapp revision deactivate \
                        --name $(adminContainerApp) \
                        --resource-group $(prodResourceGroup) \
                        --revision "$ADMIN_NEW_REV" || true
                    fi

                  else

                    echo "=========================================="
                    echo "CRITICAL: ROLLBACK FAILED"
                    echo "PRODUCTION IS STILL UNHEALTHY"
                    echo "=========================================="

                  fi

                  exit 1
                fi


                echo "=========================================="
                echo "NEW REVISIONS PASSED - PROMOTING TO PROD"
                echo "=========================================="

                az containerapp ingress traffic set \
                  --name $(storefrontContainerApp) \
                  --resource-group $(prodResourceGroup) \
                  --revision-weight "$STORE_NEW_REV=100"

                az containerapp ingress traffic set \
                  --name $(adminContainerApp) \
                  --resource-group $(prodResourceGroup) \
                  --revision-weight "$ADMIN_NEW_REV=100"

                echo "Waiting for production traffic..."
                sleep 15


                echo "=========================================="
                echo "VERIFYING PRODUCTION"
                echo "=========================================="

                STORE_PROD_STATUS=$(curl \
                  -L \
                  --write-out "%{http_code}" \
                  --silent \
                  --output /dev/null \
                  --retry 5 \
                  --retry-delay 5 \
                  "https://store.az.mavencrest.site/api/health" || true)

                ADMIN_PROD_STATUS=$(curl \
                  -L \
                  --write-out "%{http_code}" \
                  --silent \
                  --output /dev/null \
                  --retry 5 \
                  --retry-delay 5 \
                  "https://admin.az.mavencrest.site/api/health" || true)

                echo "Production Storefront: $STORE_PROD_STATUS"
                echo "Production Admin:      $ADMIN_PROD_STATUS"


                if [ "$STORE_PROD_STATUS" != "200" ] || [ "$ADMIN_PROD_STATUS" != "200" ]; then
                  echo "ERROR: Production verification failed after promotion."
                  exit 1
                fi


                echo "=========================================="
                echo "DEACTIVATING PREVIOUS REVISIONS"
                echo "=========================================="

                if [ "$STORE_GOOD_REV" != "$STORE_NEW_REV" ]; then
                  az containerapp revision deactivate \
                    --name $(storefrontContainerApp) \
                    --resource-group $(prodResourceGroup) \
                    --revision "$STORE_GOOD_REV" || true
                fi

                if [ "$ADMIN_GOOD_REV" != "$ADMIN_NEW_REV" ]; then
                  az containerapp revision deactivate \
                    --name $(adminContainerApp) \
                    --resource-group $(prodResourceGroup) \
                    --revision "$ADMIN_GOOD_REV" || true
                fi


                echo "=========================================="
                echo "PRODUCTION DEPLOYMENT SUCCESSFUL"
                echo "=========================================="

                echo "Storefront: $STORE_NEW_REV"
                echo "Admin:      $ADMIN_NEW_REV"