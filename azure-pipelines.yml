trigger:
  branches:
    include:
      - main

pool:
  vmImage: ubuntu-latest

variables:
  azureServiceConnection: 'mc-connection'
  acrName: 'acrmavencrestprodg0rn'
  acrLoginServer: 'acrmavencrestprodg0rn.azurecr.io'
  imageName: 'mavencrest-storefront'
  resourceGroup: 'rg-mavencrest-prod'
  containerAppName: 'ca-mavencrest-prod-storefront'
  imageTag: '$(Build.BuildId)'

stages:
- stage: Build
  displayName: Build and Push

  jobs:
  - job: BuildImage
    steps:
    - checkout: self

    - task: AzureCLI@2
      displayName: Login to ACR
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az acr login --name $(acrName)

    - script: |
        docker build \
          --platform linux/amd64 \
          -t $(acrLoginServer)/$(imageName):$(imageTag) \
          .
      displayName: Build Docker Image

    - script: |
        docker push $(acrLoginServer)/$(imageName):$(imageTag)
      displayName: Push Image to ACR

- stage: DeployProd
  displayName: Deploy Production
  dependsOn: Build

  jobs:
  - job: Deploy
    steps:
    - task: AzureCLI@2
      displayName: Deploy to Container App
      inputs:
        azureSubscription: '$(azureServiceConnection)'
        scriptType: bash
        scriptLocation: inlineScript
        inlineScript: |
          az containerapp update \
            --name $(containerAppName) \
            --resource-group $(resourceGroup) \
            --image $(acrLoginServer)/$(imageName):$(imageTag)